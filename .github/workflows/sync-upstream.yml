name: Sync Upstream (LePlay)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream LePlay
        run: |
          git remote add upstream https://github.com/cnyel9/leplay.git
          git fetch upstream main

      - name: Detect new upstream commits
        id: detect
        run: |
          COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Commit baru dari upstream: $COUNT"

      - name: Auto-merge upstream
        id: merge
        if: steps.detect.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit >/tmp/merge.log 2>&1 || true
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "conflict=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Merge bentrok — akan dibuka issue."
          else
            echo "conflict=0" >> "$GITHUB_OUTPUT"
            git push origin main
            echo "Upstream berhasil digabung dan di-push ke main."
          fi

      - name: Report conflict (issue)
        if: steps.merge.outputs.conflict == '1'
        run: |
          git merge --abort
          COUNT=$(git rev-list --count HEAD..upstream/main)
          git log --oneline HEAD..upstream/main > /tmp/commits.txt
          {
            echo "Upstream LePlay punya $COUNT commit baru yang **bentrok** dengan perubahan LokoTube (branding, teal, donasi, B.3, terjemahan)."
            echo ""
            echo "Selesaikan manual: \`git fetch upstream && git merge upstream/main\`, pertahankan perubahan LokoTube, build, commit, push."
            echo ""
            echo "### Commit baru dari upstream"
            echo '```'
            cat /tmp/commits.txt
            echo '```'
          } > /tmp/body.md
          gh issue create \
            --title "Sync upstream: $COUNT commit baru butuh merge manual" \
            --body-file /tmp/body.md
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}