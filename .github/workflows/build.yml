name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SM=$(ls "$SDK/cmdline-tools/"*/bin/sdkmanager 2>/dev/null | sort | tail -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37" "build-tools;36.1.0" "platform-tools" >/dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > local.properties
          P="$SDK/platforms"; [ -d "$P/android-37.0" ] && [ ! -e "$P/android-37" ] && ln -sfn android-37.0 "$P/android-37" || true
          echo "=== platforms terpasang ==="; ls "$P" 2>/dev/null

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lokotube-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed release APK (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "LokoTube-${GITHUB_REF_NAME#v}.apk"

      - name: Attach APK to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: LokoTube-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}