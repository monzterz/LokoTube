name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SM=$(ls "$SDK/cmdline-tools/"*/bin/sdkmanager 2>/dev/null | sort | tail -1)
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platforms;android-37" "build-tools;36.1.0" "platform-tools" >/dev/null 2>&1 || true
          echo "sdk.dir=$SDK" > local.properties
          P="$SDK/platforms"; [ -d "$P/android-37.0" ] && [ ! -e "$P/android-37" ] && ln -sfn android-37.0 "$P/android-37" || true
          echo "=== platforms terpasang ==="; ls "$P" 2>/dev/null

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lokotube-debug
          path: app/build/outputs/apk/github/debug/*.apk

      - name: Build signed release APK (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 -d > app/release.keystore
          ./gradlew assembleGithubRelease assembleTvRelease --no-daemon
          cp app/build/outputs/apk/github/release/app-github-release.apk "LokoTube-${GITHUB_REF_NAME#v}.apk"
          # The TV flavour updates itself now, so every release must carry its own
          # asset: without it a TV box finds the release but no matching APK.
          cp app/build/outputs/apk/tv/release/app-tv-release.apk "LokoTubeTV-${GITHUB_REF_NAME#v}-tv.apk"

      - name: Pick release notes (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-body.md
          else
            printf 'Rilis %s. Lihat riwayat perubahan di aplikasi: Setelan > Tentang > Riwayat versi.\n' "$GITHUB_REF_NAME" > release-body.md
          fi
          echo "--- release body ---"; cat release-body.md

      - name: Attach APK to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            LokoTube-*.apk
            LokoTubeTV-*.apk
          # A release without a body comes back as JSON null and the in-app
          # "What's new" section used to print the word null, so always send one.
          body_path: release-body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}